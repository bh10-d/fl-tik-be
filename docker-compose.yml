version: '3.8'

services:
  fl-tik-be:
    build:
      context: .
      dockerfile: Dockerfile
    image: fl-tik-be:1.0.0
    container_name: fl-tik-be
    restart: always
    env_file:
      - .env
    ports:
      - "4000:3000"
